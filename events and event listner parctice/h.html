<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body{
            height: 100%;
            width: 100%;
        }

        #main{
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #666;
            background-color: #222
            
        }
        
        input{
            display:none;
        }

        #input{
            color:white;
            background-color: red;
            border-radius: 15px;
            height: 100px;
            width: 200px;
            border: 2px solid #666;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #main:hover #input{
            background-color: green;
        }

    </style>
</head>
<body>
    <div id="main">
    
            <input type="file" id="file">

            <div id="input">
                upload file
            </div>
        
    </div>
    <script src="event.js"></script>  
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card Generator</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background: #222;
            color: white;
            padding: 30px;
        }

        #main{
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }

        form{
            width: 350px;
            background: #333;
            padding: 25px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="text"]{
            padding: 12px;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
        }

        input[type="text"]:focus{
            border: 2px solid royalblue;
        }

        input[type="submit"]{
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: royalblue;
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: .3s;
        }

        input[type="submit"]:hover{
            background: rgb(8, 59, 211);
        }

        /* Card Container */
        #card-container{
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Card */
        .card{
            width: 320px;
            background: #333;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,.5);
            transition: .3s;
        }

        .card:hover{
            transform: translateY(-8px);
        }

        .profile-pic{
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid royalblue;
            margin-bottom: 15px;
        }

        .name{
            font-size: 28px;
            margin-bottom: 8px;
        }

        .occupation{
            color: #6ca8ff;
            margin-bottom: 15px;
        }

        .description{
            color: #ddd;
            line-height: 1.6;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div id="main">
        <form action="">
            <input type="text" placeholder="Picture Link">
            <input type="text" placeholder="Name">
            <input type="text" placeholder="Occupation">
            <input type="text" placeholder="Description">
            <input type="submit" value="Submit">
        </form>
    </div>

    <div id="card-container">

        <div class="card">
            <img src="https://picsum.photos/200" alt="Profile Picture" class="profile-pic">

            <h2 class="name">Faizan</h2>

            <h4 class="occupation">Web Developer</h4>

            <p class="description">
                Passionate about HTML, CSS, JavaScript, and building beautiful responsive websites.
            </p>
        </div>

    </div>

    <script src="t.js"></script>

</body>
</html>

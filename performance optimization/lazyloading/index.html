<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lazy Loading Images</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }

        /* Hero */
        .hero {
            height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding-top: 80px;
        }

        .hero h1 {
            max-width: 800px;

            text-align: center;

            font-size: 50px;
            line-height: 1.4;
        }

        .hero p {
            margin-top: 120px;

            font-size: 25px;
            text-align: center;
        }


        /* Images */
        .images {
            width: 90%;
            max-width: 1000px;

            margin: auto;

            display: grid;
            grid-template-columns: repeat(2, 1fr);

            gap: 40px;

            padding-bottom: 100px;
        }


        /* Card */
        .image-card {
            background: #111;

            border-radius: 15px;

            overflow: hidden;

            border: 1px solid #333;
        }


        /* Images are invisible initially */
        .image-card img {
            width: 100%;
            height: 350px;

            object-fit: cover;

            display: block;

            opacity: 0;

            transition: opacity 0.8s ease;
        }


        /* Image becomes visible after loading */
        .image-card img.loaded {
            opacity: 1;
        }


        .image-card h2 {
            padding: 20px;
        }


        /* Mobile */
        @media (max-width: 700px) {

            .hero h1 {
                font-size: 35px;
            }

            .hero p {
                font-size: 20px;
            }

            .images {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <section class="hero">

        <h1>
            Lazy Loading Images with
            <br>
            IntersectionObserver
        </h1>

        <p>
            Scroll down to see images load only when they enter the viewport 👇
        </p>

    </section>


    <section class="images">

        <div class="image-card">

            <img
                data-src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800"
                alt="Mountain"
            >

            <h2>Mountain</h2>

        </div>


        <div class="image-card">

            <img
                data-src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=800"
                alt="Nature"
            >

            <h2>Nature</h2>

        </div>


        <div class="image-card">

            <img
                data-src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=800"
                alt="Landscape"
            >

            <h2>Landscape</h2>

        </div>


        <div class="image-card">

            <img
                data-src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=800"
                alt="Forest"
            >

            <h2>Forest</h2>

        </div>


        <div class="image-card">

            <img
                data-src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800"
                alt="Green Forest"
            >

            <h2>Green Forest</h2>

        </div>


        <div class="image-card">

            <img
                data-src="https://images.unsplash.com/photo-1511497584788-876760111969?w=800"
                alt="Trees"
            >

            <h2>Trees</h2>

        </div>

    </section>
    <script src="script.js"></script>

</body>
</html>

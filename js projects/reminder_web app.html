<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Reminder App</title>
    
    <!-- Modern Font: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           1. Global Resets & Typography
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0f0f13;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 60px 20px;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        /* =========================================
           2. Animated Background Glowing Blobs
           ========================================= */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            animation: float 10s infinite ease-in-out alternate;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background: rgba(79, 172, 254, 0.4);
            top: -10%;
            left: -10%;
        }

        .blob-2 {
            width: 350px;
            height: 350px;
            background: rgba(0, 242, 254, 0.3);
            bottom: -10%;
            right: -10%;
            animation-delay: 2s;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(30px) scale(1.1); }
        }

        /* =========================================
           3. Main App Container (Glassmorphism)
           ========================================= */
        .app-wrapper {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%;
            max-width: 550px;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        header h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        /* --- Add Task Button --- */
        #open-modal-btn {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(0, 242, 254, 0.2);
            transition: all 0.3s ease;
        }

        #open-modal-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(0, 242, 254, 0.4);
        }

        /* =========================================
           4. Filters Section
           ========================================= */
        .filters {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px;
            border-radius: 20px;
        }

        .filter-btn {
            background: transparent;
            border: none;
            color: #888;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            color: #fff;
        }

        .filter-btn.active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        /* =========================================
           5. Task Cards
           ========================================= */
        #cards-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .task-info h4 {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .task-info p {
            font-size: 12px;
            color: #aaa;
        }

        .card-buttons {
            display: flex;
            gap: 10px;
        }

        .card-buttons button {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .complete-btn {
            background: rgba(46, 213, 115, 0.15);
            color: #2ed573;
        }
        .complete-btn:hover {
            background: #2ed573;
            color: #fff;
            transform: translateY(-2px);
        }

        .delete-btn {
            background: rgba(255, 71, 87, 0.15);
            color: #ff4757;
        }
        .delete-btn:hover {
            background: #ff4757;
            color: #fff;
            transform: translateY(-2px);
        }

        /* =========================================
           6. Pop-up Modal (Form)
           ========================================= */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 1;
            transition: opacity 0.4s ease;
        }

        .modal-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .modal-content {
            background: rgba(25, 25, 30, 0.95);
            padding: 35px;
            border-radius: 24px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: scale(1);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.hidden .modal-content {
            transform: scale(0.8) translateY(20px);
        }

        .modal-content h3 {
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 13px;
            color: #aaa;
            font-weight: 500;
            margin-left: 4px;
        }

        .form-group input, .form-group textarea {
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: #4facfe;
            background: rgba(79, 172, 254, 0.05);
            box-shadow: 0 0 0 4px rgba(79, 172, 254, 0.15);
        }

        /* Custom Scrollbar for Textarea */
        textarea::-webkit-scrollbar { width: 6px; }
        textarea::-webkit-scrollbar-thumb { background: #4facfe; border-radius: 10px; }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 30px;
        }

        .cancel-btn, .save-btn {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .cancel-btn {
            background: transparent;
            color: #aaa;
        }

        .cancel-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .save-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.2);
        }

        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 242, 254, 0.4);
        }
    </style>
</head>
<body>

    <!-- Decorative Background Elements -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- Main Application UI -->
    <div class="app-wrapper">
        <header>
            <h2>My Reminders</h2>
        </header>

        <!-- Action Button -->
        <div class="header-actions">
            <button id="open-modal-btn">+ Add New Task</button>
        </div>

        <!-- Filters -->
        <div class="filters" id="filter-container">
            <button class="filter-btn active" data-filter="all">All Tasks</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <!-- Task Cards Display Area -->
        <div id="cards-container">
            <!-- Cards will be generated here by JavaScript -->
        </div>
    </div>

    <!-- Pop-up Form (Modal) -->
    <div id="task-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3>New Reminder</h3>
            
            <div class="form-group">
                <label>Task Name</label>
                <input type="text" id="task-name" placeholder="What do you need to do?">
            </div>

            <div class="form-group">
                <label>Date & Time</label>
                <input type="datetime-local" id="task-time">
            </div>

            <div class="form-group">
                <label>Description (Optional)</label>
                <textarea id="task-desc" rows="3" placeholder="Add extra details..."></textarea>
            </div>

            <div class="modal-actions">
                <button id="close-modal-btn" class="cancel-btn">Cancel</button>
                <button id="save-task-btn" class="save-btn">Save Task</button>
            </div>
        </div>
    </div>

    <!-- Link to external JS file -->
    <script src="reminder.js"></script>
</body>
</html>

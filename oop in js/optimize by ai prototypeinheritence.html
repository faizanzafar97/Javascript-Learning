<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototype Inheritance Demo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
        }
        
        h1 {
            color: #4a5568;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .coffee-display {
            background: #f7fafc;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            border-left: 4px solid #6b46c1;
        }
        
        button {
            background: #6b46c1;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            margin: 5px;
        }
        
        button:hover {
            background: #553c9a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(107, 70, 193, 0.4);
        }
        
        .output {
            margin-top: 20px;
            padding: 15px;
            background: #edf2f7;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .emoji {
            font-size: 3em;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">☕</div>
        <h1>Prototype Inheritance Demo</h1>
        
        <div class="coffee-display">
            <h2>📚 Understanding Prototype Inheritance</h2>
            <p>Objects can inherit methods and properties from other objects using prototype chain.</p>
        </div>
        
        <div style="text-align: center;">
            <button onclick="demonstrateInheritance()">🍵 Create Cappuccino</button>
            <button onclick="showAllCoffees()">📋 Show All Coffees</button>
            <button onclick="clearOutput()">🗑️ Clear Output</button>
        </div>
        
        <div id="output" class="output">
            <p style="color: #718096; text-align: center;">Click a button to see prototype inheritance in action!</p>
        </div>
    </div>

    <script src="prototype-inheritance.js"></script>
</body>
</html>

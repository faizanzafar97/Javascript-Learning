<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassmorphism Download</title>
  <style>
    /* Reset & Typography */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0f172a;
      overflow: hidden;
      position: relative;
    }

    /* Animated Background Blobs to show off the glass effect */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      animation: float 10s infinite ease-in-out alternate;
    }

    .blob-1 {
      width: 400px;
      height: 400px;
      background: rgba(139, 92, 246, 0.6); /* Purple */
      top: -100px;
      left: -100px;
    }

    .blob-2 {
      width: 350px;
      height: 350px;
      background: rgba(14, 165, 233, 0.6); /* Cyan */
      bottom: -100px;
      right: -100px;
      animation-delay: -5s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 50px) scale(1.2); }
    }

    /* Glassmorphism Card Base */
    .glass-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 24px;
      
      /* The Glass Effect */
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      
      /* Subtle borders and shadows */
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      color: #ffffff;
    }

    /* Card Content Formatting */
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .icon-box {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .icon-box svg {
      width: 24px;
      height: 24px;
      stroke: #fff;
    }

    .file-info h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .file-info p {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.6);
    }

    /* Progress Bar Base */
    .progress-wrapper {
      margin-bottom: 24px;
    }

    .progress-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 8px;
      color: rgba(255, 255, 255, 0.8);
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 99px;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
    }

    .progress-fill {
      height: 100%;
      width: 0%; /* JS will update this */
      background: linear-gradient(90deg, #0ea5e9, #8b5cf6);
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    /* Glass Button */
    .glass-btn {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .glass-btn:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>

  <!-- Background for Glass effect -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <!-- Main Component -->
  <div class="glass-card">
    <div class="header">
      <div class="icon-box">
        <!-- Feather icon for file -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
          <polyline points="13 2 13 9 20 9"></polyline>
        </svg>
      </div>
      <div class="file-info">
        <h2>macOS_Update.dmg</h2>
        <p>1.2 GB / 4.5 GB</p>
      </div>
    </div>

    <div class="progress-wrapper">
      <div class="progress-stats">
        <span>Downloading...</span>
        <span id="percentage">0%</span>
      </div>
      <div class="progress-track">
        <!-- Target this with JS to change width -->
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- Target this with JS for click events -->
    <button class="glass-btn" id="download-btn">Start Download</button>
  </div>
  <script src="download_simulaton.js"></script>
</body>
</html>
